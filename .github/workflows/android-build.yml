name: Build mimalloc for Android arm64

on:
  workflow_dispatch:

env:
  MI_PARAMS: -DMI_OVERRIDE=OFF -DMI_OSX_INTERPOSE=OFF -DMI_OSX_ZONE=OFF -DMI_WIN_REDIRECT=OFF -DMI_BUILD_STATIC=OFF -DMI_BUILD_OBJECT=OFF -DMI_BUILD_TESTS=OFF

jobs:
  android-arm64:
    name: Android arm64 (API 26+)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      # NDK 已预置，直接使用环境变量
      - name: Configure build
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26 \
            -DCMAKE_BUILD_TYPE=Release \
            -DMI_BUILD_SHARED=ON \
            -DCMAKE_C_FLAGS="-O3 -pipe -integrated-as -mllvm -polly -mllvm -polly-vectorizer=stripmine -mllvm -polly-invariant-load-hoisting -mllvm -polly-run-inliner -mllvm -polly-run-dce -mllvm -polly-invariant-load-hoisting -flto -mllvm -polly-run-inliner -mllvm -polly-run-dce -fdata-sections -ffunction-sections -mllvm -polly-detect-keep-going -mllvm -polly-ast-use-context -fvisibility=hidden -Wall -Wextra -ferror-limit=0 -Wno-return-type -Wno-unused-parameter -Wno-c++98-compat -Wno-c++98-compat-pedantic -DGLM_FORCE_INTRINSICS -Wno-unicode-whitespace -Wno-format -Wno-unused-function -Wno-vla-cxx-extension -fmerge-all-constants -D_FILE_OFFSET_BITS=64 -mllvm -inlinehint-threshold=100000" \
            -DCMAKE_CXX_FLAGS="-O3 -pipe -integrated-as -mllvm -polly -mllvm -polly-vectorizer=stripmine -mllvm -polly-invariant-load-hoisting -mllvm -polly-run-inliner -mllvm -polly-run-dce -mllvm -polly-invariant-load-hoisting -flto -mllvm -polly-run-inliner -mllvm -polly-run-dce -fdata-sections -ffunction-sections -mllvm -polly-detect-keep-going -mllvm -polly-ast-use-context -fvisibility=hidden -Wall -Wextra -ferror-limit=0 -Wno-return-type -Wno-unused-parameter -Wno-c++98-compat -Wno-c++98-compat-pedantic -DGLM_FORCE_INTRINSICS -Wno-unicode-whitespace -Wno-format -Wno-unused-function -Wno-vla-cxx-extension -fmerge-all-constants -D_FILE_OFFSET_BITS=64 -mllvm -inlinehint-threshold=100000" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fuse-ld=lld -Wl,--strip-all -fvisibility=hidden -Wl,--gc-sections -Wl,--as-needed -static-libstdc++ -Wl,--exclude-libs,ALL" \
            $MI_PARAMS

      - name: Build
        run: cmake --build build --parallel

      - name: Strip debug symbols
        run: $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip build/libmimalloc.so

      - name: Generate git revision
        run: |
          git config --global --add safe.directory $(pwd)
          git log --first-parent --pretty=format:%H --skip 1 -n 1 > revision.git
          cat revision.git

      - name: Upload artifacts (shared library and revision)
        uses: actions/upload-artifact@v4
        with:
          name: android-arm64-mimalloc
          path: |
            build/libmimalloc.so
            revision.git
          if-no-files-found: error
